name: Build, test, pack, and publish

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "global.json"
      - "NuGet.config"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - ".github/workflows/build-and-publish.yml"

permissions:
  contents: read

jobs:
  build-and-publish:
    uses: swalterlabs/EvilBaschdi.BuildTemplates/.github/workflows/build-n-pack-multi-stage.yml@main
    with:
      projects: '["EvilBaschdi.Testing"]'
      framework: net10.0
      projects-parent-directory: src/
      tests-parent-directory: tests/
      azure-artifacts-source: https://pkgs.dev.azure.com/evilbaschdi/_packaging/evilfeed/nuget/v3/index.json
    secrets:
      AZURE_ARTIFACTS_PAT: ${{ secrets.AZURE_ARTIFACTS_PAT }}
      MYGET_API_KEY: ${{ secrets.MYGET_API_KEY }}
      CODEBERG_API_KEY: ${{ secrets.CODEBERG_API_KEY }}
